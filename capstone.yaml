run: "DATABASE_URL=postgresql+psycopg://metering:metering@localhost:5432/metering .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000"
seed: "DATABASE_URL=postgresql+psycopg://metering:metering@localhost:5432/metering .venv/bin/python -m app.seed"
test: ".venv/bin/pytest"
base_url: "http://localhost:8000"
endpoints:
  - "GET /health"
  - "POST /generate"
  - "GET /usage"
  - "POST /checkout/pro"
  - "POST /webhooks/stripe"
